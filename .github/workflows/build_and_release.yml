name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Release Artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk MessFlow-v2.1.3.apk

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MessFlow-v2.1.3-APK
          path: MessFlow-v2.1.3.apk

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v2.1.3 MessFlow-v2.1.3.apk --clobber || gh release create v2.1.3 MessFlow-v2.1.3.apk --title "MessFlow v2.1.3" --notes "MessFlow v2.1.3 cloud build with background notifications and meal entry fixes."
